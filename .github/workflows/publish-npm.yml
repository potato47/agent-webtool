name: Publish agent-webtool
on:
  push:
    tags: ["v*"]
  # Manual runs validate and upload an archive, but never publish.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webtool-npm-release
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'potato47/agent-webtool'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      filename: ${{ steps.release.outputs.filename }}
      dist-tag: ${{ steps.release.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate package metadata and exact release tag
        id: release
        run: bun run npm:check --release
      - run: bun run check
      - run: bun test test/
      - run: bun run npm:pack
      - run: git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agent-webtool-npm
          path: |
            artifacts/npm/${{ steps.release.outputs.filename }}
            artifacts/npm/${{ steps.release.outputs.filename }}.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish:
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'potato47/agent-webtool'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: agent-webtool-npm
          path: npm-package
      - name: Publish the verified archive with OIDC
        working-directory: npm-package
        env:
          PACKAGE_FILE: ${{ needs.build.outputs.filename }}
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: |
          sha256sum --check "$PACKAGE_FILE.sha256"
          npm publish "./$PACKAGE_FILE" --access public --tag "$DIST_TAG" --ignore-scripts --registry=https://registry.npmjs.org
